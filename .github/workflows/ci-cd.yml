name: CI/CD GoodFood

on:
  push:
    branches:
      - develop
      - master

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: front-web
            context: ./goodfood-front-web
          - service: ms-auth
            context: ./goodfood-ms-auth
          - service: ms-restaurant
            context: ./goodfood-ms-restaurant
          - service: ms-paiement
            context: ./goodfood-ms-paiement
          - service: ms-commandes
            context: ./goodfood-ms-commandes
          - service: ms-tracking
            context: ./goodfood-ms-tracking
          - service: ms-sav
            context: ./goodfood-ms-sav
          - service: ms-notifications
            context: ./goodfood-ms-notifications
          - service: ms-logs
            context: ./goodfood-ms-logs
          - service: ms-stock
            context: ./goodfood-ms-stock
          - service: ms-fournisseurs
            context: ./goodfood-ms-fournisseurs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lowercase registry owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/goodfood-${{ matrix.service }}:${{ github.sha }}

  publish:
    name: Publish [${{ matrix.service }}]
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: front-web
            context: ./goodfood-front-web
          - service: ms-auth
            context: ./goodfood-ms-auth
          - service: ms-restaurant
            context: ./goodfood-ms-restaurant
          - service: ms-paiement
            context: ./goodfood-ms-paiement
          - service: ms-commandes
            context: ./goodfood-ms-commandes
          - service: ms-tracking
            context: ./goodfood-ms-tracking
          - service: ms-sav
            context: ./goodfood-ms-sav
          - service: ms-notifications
            context: ./goodfood-ms-notifications
          - service: ms-logs
            context: ./goodfood-ms-logs
          - service: ms-stock
            context: ./goodfood-ms-stock
          - service: ms-fournisseurs
            context: ./goodfood-ms-fournisseurs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lowercase registry owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/goodfood-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/goodfood-${{ matrix.service }}:latest

  sonarqube:
    name: SonarQube Scan [${{ matrix.service }}]
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: front-web
            context: ./goodfood-front-web
            projectKey: goodfood-front-web
            token: SONAR_TOKEN_FRONT_WEB
          - service: ms-auth
            context: ./goodfood-ms-auth
            projectKey: goodfood-ms-auth
            token: SONAR_TOKEN_MS_AUTH
          - service: ms-restaurant
            context: ./goodfood-ms-restaurant
            projectKey: goodfood-ms-restaurant
            token: SONAR_TOKEN_MS_RESTAURANT
          - service: ms-paiement
            context: ./goodfood-ms-paiement
            projectKey: goodfood-ms-paiement
            token: SONAR_TOKEN_MS_PAIEMENT
          - service: ms-commandes
            context: ./goodfood-ms-commandes
            projectKey: goodfood-ms-commandes
            token: SONAR_TOKEN_MS_COMMANDES
          - service: ms-tracking
            context: ./goodfood-ms-tracking
            projectKey: goodfood-ms-tracking
            token: SONAR_TOKEN_MS_TRACKING
          - service: ms-sav
            context: ./goodfood-ms-sav
            projectKey: goodfood-ms-sav
            token: SONAR_TOKEN_MS_SAV
          - service: ms-notifications
            context: ./goodfood-ms-notifications
            projectKey: goodfood-ms-notifications
            token: SONAR_TOKEN_MS_NOTIFICATIONS
          - service: ms-logs
            context: ./goodfood-ms-logs
            projectKey: goodfood-ms-logs
            token: SONAR_TOKEN_MS_LOGS
          - service: ms-stock
            context: ./goodfood-ms-stock
            projectKey: goodfood-ms-stock
            token: SONAR_TOKEN_MS_STOCK
          - service: ms-fournisseurs
            context: ./goodfood-ms-fournisseurs
            projectKey: goodfood-ms-fournisseur
            token: SONAR_TOKEN_MS_FOURNISSEURS
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets[matrix.token] }}
          SONAR_HOST_URL: https://sonar.romainmurier.com
        with:
          projectBaseDir: ${{ matrix.context }}
          args: >
            -Dsonar.projectKey=${{ matrix.projectKey }}
            -Dsonar.projectName=${{ matrix.projectKey }}

  dependency-check:
    name: Dependency Check [${{ matrix.service }}]
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: front-web
            context: ./goodfood-front-web
          - service: ms-auth
            context: ./goodfood-ms-auth
          - service: ms-restaurant
            context: ./goodfood-ms-restaurant
          - service: ms-paiement
            context: ./goodfood-ms-paiement
          - service: ms-commandes
            context: ./goodfood-ms-commandes
          - service: ms-tracking
            context: ./goodfood-ms-tracking
          - service: ms-sav
            context: ./goodfood-ms-sav
          - service: ms-notifications
            context: ./goodfood-ms-notifications
          - service: ms-logs
            context: ./goodfood-ms-logs
          - service: ms-stock
            context: ./goodfood-ms-stock
          - service: ms-fournisseurs
            context: ./goodfood-ms-fournisseurs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          project: goodfood-${{ matrix.service }}
          path: ${{ matrix.context }}
          format: 'HTML'
          others: >
            --failOnCVSS 7
            --enableRetired

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-${{ matrix.service }}
          path: ${{ github.workspace }}/reports

  gitguardian:
    name: GitGuardian Scan
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@v1.52.2
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  trivy:
    name: Trivy Image Scan [${{ matrix.service }}]
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: front-web
          - service: ms-auth
          - service: ms-restaurant
          - service: ms-paiement
          - service: ms-commandes
          - service: ms-tracking
          - service: ms-sav
          - service: ms-notifications
          - service: ms-logs
          - service: ms-stock
          - service: ms-fournisseurs
    steps:
      - name: Lowercase registry owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/goodfood-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  unit-tests:
    name: Tests [${{ matrix.service }}]
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ms-auth
            type: dotnet
            path: goodfood-ms-auth/GoodFood.Auth.Tests/GoodFood.Auth.Tests.csproj
          - service: ms-commandes
            type: dotnet
            path: goodfood-ms-commandes/GoodFood.Commandes.Tests/GoodFood.Commandes.Tests.csproj
          - service: ms-fournisseurs
            type: dotnet
            path: goodfood-ms-fournisseurs/GoodFood.Fournisseurs.Tests/GoodFood.Fournisseurs.Tests.csproj
          - service: ms-logs
            type: dotnet
            path: goodfood-ms-logs/GoodFood.Logs.Tests/GoodFood.Logs.Tests.csproj
          - service: ms-notifications
            type: dotnet
            path: goodfood-ms-notifications/GoodFood.Notifications.Tests/GoodFood.Notifications.Tests.csproj
          - service: ms-sav
            type: dotnet
            path: goodfood-ms-sav/GoodFood.Sav.Tests/GoodFood.Sav.Tests.csproj
          - service: ms-stock
            type: dotnet
            path: goodfood-ms-stock/GoodFood.Stock.Tests/GoodFood.Stock.Tests.csproj
          - service: ms-tracking
            type: dotnet
            path: goodfood-ms-tracking/GoodFood.Tracking.Tests/GoodFood.Tracking.Tests.csproj
          - service: ms-restaurant
            type: python
            path: goodfood-ms-restaurant
          - service: front-web
            type: node-vitest
            path: goodfood-front-web
          - service: ms-paiement
            type: node-jest
            path: goodfood-ms-paiement
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        if: matrix.type == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run .NET tests
        if: matrix.type == 'dotnet'
        run: dotnet test ${{ matrix.path }} --verbosity normal

      - name: Setup Python
        if: matrix.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: matrix.type == 'python'
        run: pip install -r ${{ matrix.path }}/requirements.txt

      - name: Run Python tests
        if: matrix.type == 'python'
        run: pytest ${{ matrix.path }}/tests/

      - name: Setup Node.js
        if: matrix.type == 'node-vitest'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: matrix.type == 'node-vitest'
        run: npm install --prefix ${{ matrix.path }}

      - name: Run Vitest tests
        if: matrix.type == 'node-vitest'
        run: npm test --prefix ${{ matrix.path }}

      - name: Setup Node.js
        if: matrix.type == 'node-jest'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: matrix.type == 'node-jest'
        run: npm install --prefix ${{ matrix.path }}

      - name: Run Jest tests
        if: matrix.type == 'node-jest'
        run: npm test --prefix ${{ matrix.path }}

  deploy-dev:
    name: Deploy [dev]
    if: github.ref == 'refs/heads/develop'
    needs: [sonarqube, unit-tests, dependency-check, gitguardian, trivy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase registry owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to K3S — namespace goodfood-dev
        run: |
          # TODO: add KUBECONFIG secret and uncomment the commands below
          # echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml
          # export KUBECONFIG=kubeconfig.yaml
          # helm upgrade --install goodfood ./helm/goodfood \
          #   --namespace goodfood-dev \
          #   --create-namespace \
          #   --set global.image.tag=${{ github.sha }} \
          #   --set global.registry=${{ env.REGISTRY }}/${{ env.OWNER }} \
          #   --values ./helm/goodfood/values.yaml
          echo "Deploy to K3S namespace goodfood-dev — image tag: ${{ github.sha }}"

  deploy-prod:
    name: Deploy [prod]
    if: github.ref == 'refs/heads/master'
    needs: [sonarqube, unit-tests, dependency-check, gitguardian, trivy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase registry owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to K3S — namespace goodfood
        run: |
          # TODO: add KUBECONFIG secret and uncomment the commands below
          # echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml
          # export KUBECONFIG=kubeconfig.yaml
          # helm upgrade --install goodfood ./helm/goodfood \
          #   --namespace goodfood \
          #   --create-namespace \
          #   --set global.image.tag=${{ github.sha }} \
          #   --set global.registry=${{ env.REGISTRY }}/${{ env.OWNER }} \
          #   --values ./helm/goodfood/values-prod.yaml
          echo "Deploy to K3S namespace goodfood — image tag: ${{ github.sha }}"
