name: CI/CD GoodFood

on:
  push:
    branches:
      - develop
      - master

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      sonar_matrix: ${{ steps.matrices.outputs.sonar_matrix }}
      tests_matrix: ${{ steps.matrices.outputs.tests_matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed submodules
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref_name }}
          filters: |
            front-web:
              - goodfood-front-web
              - goodfood-front-web/**
              - .github/workflows/ci-cd.yml
            ms-auth:
              - goodfood-ms-auth
              - goodfood-ms-auth/**
              - .github/workflows/ci-cd.yml
            ms-restaurant:
              - goodfood-ms-restaurant
              - goodfood-ms-restaurant/**
              - .github/workflows/ci-cd.yml
            ms-paiement:
              - goodfood-ms-paiement
              - goodfood-ms-paiement/**
              - .github/workflows/ci-cd.yml
            ms-commandes:
              - goodfood-ms-commandes
              - goodfood-ms-commandes/**
              - .github/workflows/ci-cd.yml
            ms-tracking:
              - goodfood-ms-tracking
              - goodfood-ms-tracking/**
              - .github/workflows/ci-cd.yml
            ms-sav:
              - goodfood-ms-sav
              - goodfood-ms-sav/**
              - .github/workflows/ci-cd.yml
            ms-notifications:
              - goodfood-ms-notifications
              - goodfood-ms-notifications/**
              - .github/workflows/ci-cd.yml
            ms-logs:
              - goodfood-ms-logs
              - goodfood-ms-logs/**
              - .github/workflows/ci-cd.yml
            ms-stock:
              - goodfood-ms-stock
              - goodfood-ms-stock/**
              - .github/workflows/ci-cd.yml
            ms-fournisseurs:
              - goodfood-ms-fournisseurs
              - goodfood-ms-fournisseurs/**
              - .github/workflows/ci-cd.yml

      - name: Build per-job matrices
        id: matrices
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          SONAR_TABLE='[
            {"service":"front-web","context":"./goodfood-front-web","projectKey":"goodfood-front-web","token":"SONAR_TOKEN_FRONT_WEB"},
            {"service":"ms-auth","context":"./goodfood-ms-auth","projectKey":"goodfood-ms-auth","token":"SONAR_TOKEN_MS_AUTH"},
            {"service":"ms-restaurant","context":"./goodfood-ms-restaurant","projectKey":"goodfood-ms-restaurant","token":"SONAR_TOKEN_MS_RESTAURANT"},
            {"service":"ms-paiement","context":"./goodfood-ms-paiement","projectKey":"goodfood-ms-paiement","token":"SONAR_TOKEN_MS_PAIEMENT"},
            {"service":"ms-commandes","context":"./goodfood-ms-commandes","projectKey":"goodfood-ms-commandes","token":"SONAR_TOKEN_MS_COMMANDES"},
            {"service":"ms-tracking","context":"./goodfood-ms-tracking","projectKey":"goodfood-ms-tracking","token":"SONAR_TOKEN_MS_TRACKING"},
            {"service":"ms-sav","context":"./goodfood-ms-sav","projectKey":"goodfood-ms-sav","token":"SONAR_TOKEN_MS_SAV"},
            {"service":"ms-notifications","context":"./goodfood-ms-notifications","projectKey":"goodfood-ms-notifications","token":"SONAR_TOKEN_MS_NOTIFICATIONS"},
            {"service":"ms-logs","context":"./goodfood-ms-logs","projectKey":"goodfood-ms-logs","token":"SONAR_TOKEN_MS_LOGS"},
            {"service":"ms-stock","context":"./goodfood-ms-stock","projectKey":"goodfood-ms-stock","token":"SONAR_TOKEN_MS_STOCK"},
            {"service":"ms-fournisseurs","context":"./goodfood-ms-fournisseurs","projectKey":"goodfood-ms-fournisseur","token":"SONAR_TOKEN_MS_FOURNISSEURS"}
          ]'

          TESTS_TABLE='[
            {"service":"ms-auth","type":"dotnet","path":"goodfood-ms-auth/GoodFood.Auth.Tests/GoodFood.Auth.Tests.csproj"},
            {"service":"ms-commandes","type":"dotnet","path":"goodfood-ms-commandes/GoodFood.Commandes.Tests/GoodFood.Commandes.Tests.csproj"},
            {"service":"ms-fournisseurs","type":"dotnet","path":"goodfood-ms-fournisseurs/GoodFood.Fournisseurs.Tests/GoodFood.Fournisseurs.Tests.csproj"},
            {"service":"ms-logs","type":"dotnet","path":"goodfood-ms-logs/GoodFood.Logs.Tests/GoodFood.Logs.Tests.csproj"},
            {"service":"ms-notifications","type":"dotnet","path":"goodfood-ms-notifications/GoodFood.Notifications.Tests/GoodFood.Notifications.Tests.csproj"},
            {"service":"ms-sav","type":"dotnet","path":"goodfood-ms-sav/GoodFood.Sav.Tests/GoodFood.Sav.Tests.csproj"},
            {"service":"ms-stock","type":"dotnet","path":"goodfood-ms-stock/GoodFood.Stock.Tests/GoodFood.Stock.Tests.csproj"},
            {"service":"ms-tracking","type":"dotnet","path":"goodfood-ms-tracking/GoodFood.Tracking.Tests/GoodFood.Tracking.Tests.csproj"},
            {"service":"ms-restaurant","type":"python","path":"goodfood-ms-restaurant"},
            {"service":"front-web","type":"node-vitest","path":"goodfood-front-web"},
            {"service":"ms-paiement","type":"node-jest","path":"goodfood-ms-paiement"}
          ]'

          SONAR_MATRIX=$(echo "$SONAR_TABLE" | jq -c --argjson changed "$CHANGED" '[.[] | select(.service as $s | $changed | index($s) != null)]')
          TESTS_MATRIX=$(echo "$TESTS_TABLE" | jq -c --argjson changed "$CHANGED" '[.[] | select(.service as $s | $changed | index($s) != null)]')

          echo "sonar_matrix=$SONAR_MATRIX" >> "$GITHUB_OUTPUT"
          echo "tests_matrix=$TESTS_MATRIX" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Scan Image [${{ matrix.service }}]
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lowercase registry owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./goodfood-${{ matrix.service }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/goodfood-${{ matrix.service }}:${{ github.sha }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/goodfood-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: Publish [${{ matrix.service }}]
    needs: [detect-changes, build, sonarqube, dependency-check, gitguardian, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lowercase registry owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ./goodfood-${{ matrix.service }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/goodfood-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/goodfood-${{ matrix.service }}:latest

  sonarqube:
    name: SonarQube Scan [${{ matrix.service }}]
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.sonar_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets[matrix.token] }}
          SONAR_HOST_URL: https://sonar.romainmurier.com
        with:
          projectBaseDir: ${{ matrix.context }}
          args: >
            -Dsonar.projectKey=${{ matrix.projectKey }}
            -Dsonar.projectName=${{ matrix.projectKey }}

  dependency-check:
    name: Dependency Check [${{ matrix.service }}]
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: OWASP Dependency-Check
        run: |
          mkdir -p reports
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            owasp/dependency-check-action:latest \
            --project "goodfood-${{ matrix.service }}" \
            --scan "goodfood-${{ matrix.service }}" \
            --format HTML \
            --out reports \
            --noupdate \
            --failOnCVSS 7

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-${{ matrix.service }}
          path: ${{ github.workspace }}/reports

  gitguardian:
    name: GitGuardian Scan
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@v1.52.2
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  unit-tests:
    name: Tests [${{ matrix.service }}]
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.tests_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        if: matrix.type == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run .NET tests
        if: matrix.type == 'dotnet'
        run: dotnet test ${{ matrix.path }} --verbosity normal

      - name: Setup Python
        if: matrix.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: matrix.type == 'python'
        run: pip install -r ${{ matrix.path }}/requirements.txt

      - name: Run Python tests
        if: matrix.type == 'python'
        run: pytest ${{ matrix.path }}/tests/

      - name: Setup Node.js
        if: matrix.type == 'node-vitest'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: matrix.type == 'node-vitest'
        run: npm install --prefix ${{ matrix.path }}

      - name: Run Vitest tests
        if: matrix.type == 'node-vitest'
        run: npm test --prefix ${{ matrix.path }}

      - name: Setup Node.js
        if: matrix.type == 'node-jest'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: matrix.type == 'node-jest'
        run: npm install --prefix ${{ matrix.path }}

      - name: Run Jest tests
        if: matrix.type == 'node-jest'
        run: npm test --prefix ${{ matrix.path }}

  deploy-dev:
    name: Deploy [dev]
    if: github.ref == 'refs/heads/develop'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase registry owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to K3S — namespace goodfood-dev
        run: |
          # TODO: add KUBECONFIG secret and uncomment the commands below
          # echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml
          # export KUBECONFIG=kubeconfig.yaml
          # helm upgrade --install goodfood ./helm/goodfood \
          #   --namespace goodfood-dev \
          #   --create-namespace \
          #   --set global.image.tag=${{ github.sha }} \
          #   --set global.registry=${{ env.REGISTRY }}/${{ env.OWNER }} \
          #   --values ./helm/goodfood/values.yaml
          echo "Deploy to K3S namespace goodfood-dev — image tag: ${{ github.sha }}"

  deploy-prod:
    name: Deploy [prod]
    if: github.ref == 'refs/heads/master'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase registry owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to K3S — namespace goodfood
        run: |
          # TODO: add KUBECONFIG secret and uncomment the commands below
          # echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml
          # export KUBECONFIG=kubeconfig.yaml
          # helm upgrade --install goodfood ./helm/goodfood \
          #   --namespace goodfood \
          #   --create-namespace \
          #   --set global.image.tag=${{ github.sha }} \
          #   --set global.registry=${{ env.REGISTRY }}/${{ env.OWNER }} \
          #   --values ./helm/goodfood/values-prod.yaml
          echo "Deploy to K3S namespace goodfood — image tag: ${{ github.sha }}"
