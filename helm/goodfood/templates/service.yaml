{{- range $key, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  labels:
    app: {{ $svc.name }}
spec:
  selector:
    app: {{ $svc.name }}
  ports:
    - name: http
      port: {{ $svc.port | default 8080 }}
      targetPort: {{ $svc.port | default 8080 }}
---
{{- end }}
{{- end }}
